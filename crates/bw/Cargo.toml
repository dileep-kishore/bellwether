[package]
name = "bw"
version = "0.7.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
chrono = "0.4"
herdr-core = { path = "../vendor/herdr-core" }
libc = "0.2"
notify = { version = "7.0.0", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
similar = "2"
toml = "0.8"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
