name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Bellwether runs on macOS only: the browser and window code calls osascript and AppKit.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # rustup on the runner installs the channel and components in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/vendor -> ../../target/vendor
      - run: bun install --frozen-lockfile
      # Without herdr-app, scripts/check.sh renders each mod in the headless harness instead.
      - run: scripts/test.sh --offline
